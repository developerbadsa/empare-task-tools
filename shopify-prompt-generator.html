<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify Store Prompt Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #8892b0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* Progress Bar */
        .progress-section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 18px 24px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-header span {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .progress-percent {
            font-size: 1.4rem;
            font-weight: 700;
            color: #00d2ff;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3a7bd5, #00d2ff);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .progress-details {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #8892b0;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #a8b2d1;
        }

        label .required {
            color: #ff6b6b;
        }

        input, select, textarea {
            padding: 11px 14px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: #e0e0e0;
            font-size: 0.92rem;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58,123,213,0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        /* Checkbox Group */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .checkbox-group label:hover {
            border-color: #3a7bd5;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #3a7bd5;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 28px;
            justify-content: center;
        }

        .btn {
            padding: 13px 36px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(58,123,213,0.35);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #a8b2d1;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
        }

        /* Output Section */
        .output-section {
            margin-top: 36px;
            display: none;
        }

        .output-section.active {
            display: block;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .output-header h2 {
            font-size: 1.3rem;
            color: #00d2ff;
        }

        .copy-btn {
            padding: 8px 20px;
            background: rgba(0,210,255,0.15);
            border: 1px solid rgba(0,210,255,0.3);
            color: #00d2ff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(0,210,255,0.25);
        }

        .copy-btn.copied {
            background: rgba(0,200,83,0.15);
            border-color: rgba(0,200,83,0.3);
            color: #00c853;
        }

        .prompt-output {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 24px;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #c8d6e5;
            max-height: 500px;
            overflow-y: auto;
        }

        .prompt-output::-webkit-scrollbar {
            width: 6px;
        }

        .prompt-output::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛍️ Shopify Store Prompt Generator</h1>
    <p class="subtitle">Fill in your store details → Get a ready-to-paste prompt for ChatGPT / Claude / Gemini</p>

    <!-- Progress Bar -->
    <div class="progress-section">
        <div class="progress-header">
            <span>📊 Completion</span>
            <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-details" id="progressDetails">0 of 12 fields filled</div>
    </div>

    <!-- Form -->
    <form id="storeForm">
        <div class="form-grid">
            <!-- Store Name -->
            <div class="form-group">
                <label>Store Name <span class="required">*</span></label>
                <input type="text" id="storeName" placeholder="e.g. UrbanKart" data-track>
            </div>

            <!-- Store Niche -->
            <div class="form-group">
                <label>Store Niche / Category <span class="required">*</span></label>
                <select id="storeNiche" data-track>
                    <option value="">-- Select --</option>
                    <option value="Fashion & Clothing">Fashion & Clothing</option>
                    <option value="Beauty & Skincare">Beauty & Skincare</option>
                    <option value="Electronics & Gadgets">Electronics & Gadgets</option>
                    <option value="Home & Kitchen">Home & Kitchen</option>
                    <option value="Health & Wellness">Health & Wellness</option>
                    <option value="Food & Beverages">Food & Beverages</option>
                    <option value="Sports & Fitness">Sports & Fitness</option>
                    <option value="Pet Supplies">Pet Supplies</option>
                    <option value="Kids & Baby">Kids & Baby</option>
                    <option value="Jewelry & Accessories">Jewelry & Accessories</option>
                    <option value="Digital Products">Digital Products</option>
                    <option value="Dropshipping">Dropshipping</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Target Audience -->
            <div class="form-group">
                <label>Target Audience (Age Group)</label>
                <select id="targetAge" data-track>
                    <option value="">-- Select --</option>
                    <option value="13-17 (Teens)">13-17 (Teens)</option>
                    <option value="18-24 (Young Adults)">18-24 (Young Adults)</option>
                    <option value="25-34 (Adults)">25-34 (Adults)</option>
                    <option value="35-44 (Middle Age)">35-44 (Middle Age)</option>
                    <option value="45+ (Seniors)">45+ (Seniors)</option>
                    <option value="All Ages">All Ages</option>
                </select>
            </div>

            <!-- Target Gender -->
            <div class="form-group">
                <label>Target Gender</label>
                <select id="targetGender" data-track>
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Unisex / All">Unisex / All</option>
                </select>
            </div>

            <!-- Target Country -->
            <div class="form-group">
                <label>Target Country / Region</label>
                <input type="text" id="targetCountry" placeholder="e.g. Bangladesh, USA, UK" data-track>
            </div>

            <!-- Number of Products -->
            <div class="form-group">
                <label>Number of Products (approx)</label>
                <input type="number" id="productCount" placeholder="e.g. 50" min="1" data-track>
            </div>

            <!-- Price Range -->
            <div class="form-group">
                <label>Price Range (per product)</label>
                <select id="priceRange" data-track>
                    <option value="">-- Select --</option>
                    <option value="Budget ($1-$15)">Budget ($1-$15)</option>
                    <option value="Low ($15-$50)">Low ($15-$50)</option>
                    <option value="Mid-Range ($50-$150)">Mid-Range ($50-$150)</option>
                    <option value="Premium ($150-$500)">Premium ($150-$500)</option>
                    <option value="Luxury ($500+)">Luxury ($500+)</option>
                </select>
            </div>

            <!-- Brand Voice -->
            <div class="form-group">
                <label>Brand Voice / Tone</label>
                <select id="brandVoice" data-track>
                    <option value="">-- Select --</option>
                    <option value="Professional & Trustworthy">Professional & Trustworthy</option>
                    <option value="Casual & Friendly">Casual & Friendly</option>
                    <option value="Luxury & Elegant">Luxury & Elegant</option>
                    <option value="Fun & Trendy">Fun & Trendy</option>
                    <option value="Minimalist & Clean">Minimalist & Clean</option>
                    <option value="Bold & Edgy">Bold & Edgy</option>
                </select>
            </div>

            <!-- Shopify Plan -->
            <div class="form-group">
                <label>Shopify Plan</label>
                <select id="shopifyPlan" data-track>
                    <option value="">-- Select --</option>
                    <option value="Shopify Basic">Shopify Basic</option>
                    <option value="Shopify">Shopify</option>
                    <option value="Shopify Advanced">Shopify Advanced</option>
                    <option value="Not decided yet">Not decided yet</option>
                </select>
            </div>

            <!-- Store Description -->
            <div class="form-group full-width">
                <label>Store Description (What do you sell?)</label>
                <textarea id="storeDescription" placeholder="e.g. We sell handmade organic skincare products for women who prefer natural ingredients..." data-track></textarea>
            </div>

            <!-- Key Products / Best Sellers -->
            <div class="form-group full-width">
                <label>Key Products / Best Sellers (comma separated)</label>
                <input type="text" id="keyProducts" placeholder="e.g. Vitamin C Serum, Hair Growth Oil, Acne Cream" data-track>
            </div>

            <!-- Special Requirements -->
            <div class="form-group full-width">
                <label>Any Special Requirements or Notes</label>
                <textarea id="specialRequirements" placeholder="e.g. Need bilingual store (Bangla + English), focus on SEO, need social proof sections..." data-track></textarea>
            </div>

            <!-- What Do You Need? -->
            <div class="form-group full-width">
                <label>What do you need the prompt for?</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="Store Setup & Theme" data-check> Store Setup & Theme</label>
                    <label><input type="checkbox" value="Product Descriptions" data-check> Product Descriptions</label>
                    <label><input type="checkbox" value="SEO Optimization" data-check> SEO Optimization</label>
                    <label><input type="checkbox" value="Social Media Content" data-check> Social Media Content</label>
                    <label><input type="checkbox" value="Email Marketing" data-check> Email Marketing</label>
                    <label><input type="checkbox" value="Ad Copywriting" data-check> Ad Copywriting</label>
                    <label><input type="checkbox" value="About Us / Policies" data-check> About Us / Policies</label>
                    <label><input type="checkbox" value="Complete Store Strategy" data-check> Complete Store Strategy</label>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
            <button type="submit" class="btn btn-primary">🚀 Generate Prompt</button>
        </div>
    </form>

    <!-- Output -->
    <div class="output-section" id="outputSection">
        <div class="output-header">
            <h2>📋 Your Ready-to-Paste Prompt</h2>
            <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">📋 Copy</button>
        </div>
        <div class="prompt-output" id="promptOutput"></div>
    </div>
</div>

<script>
    // Track form progress
    const trackedInputs = document.querySelectorAll('[data-track]');
    const checkboxes = document.querySelectorAll('[data-check]');
    const totalFields = trackedInputs.length + 1; // +1 for checkbox group

    function updateProgress() {
        let filled = 0;
        trackedInputs.forEach(input => {
            if (input.value.trim() !== '') filled++;
        });

        // Check if any checkbox is checked
        let anyChecked = false;
        checkboxes.forEach(cb => { if (cb.checked) anyChecked = true; });
        if (anyChecked) filled++;

        const percent = Math.round((filled / totalFields) * 100);
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressPercent').textContent = percent + '%';
        document.getElementById('progressDetails').textContent = `${filled} of ${totalFields} fields filled`;

        // Color change based on progress
        const bar = document.getElementById('progressBar');
        if (percent < 30) {
            bar.style.background = 'linear-gradient(90deg, #ff6b6b, #ff9a56)';
        } else if (percent < 70) {
            bar.style.background = 'linear-gradient(90deg, #ff9a56, #feca57)';
        } else {
            bar.style.background = 'linear-gradient(90deg, #3a7bd5, #00d2ff)';
        }
    }

    trackedInputs.forEach(input => input.addEventListener('input', updateProgress));
    checkboxes.forEach(cb => cb.addEventListener('change', updateProgress));

    // Form Submit
    document.getElementById('storeForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const storeName = document.getElementById('storeName').value.trim();
        const storeNiche = document.getElementById('storeNiche').value;

        if (!storeName || !storeNiche) {
            alert('⚠️ Boss, at least Store Name & Niche fill up koro!');
            return;
        }

        // Gather values
        const data = {
            name: storeName,
            niche: storeNiche,
            age: document.getElementById('targetAge').value || 'Not specified',
            gender: document.getElementById('targetGender').value || 'Not specified',
            country: document.getElementById('targetCountry').value || 'Not specified',
            productCount: document.getElementById('productCount').value || 'Not specified',
            priceRange: document.getElementById('priceRange').value || 'Not specified',
            brandVoice: document.getElementById('brandVoice').value || 'Not specified',
            shopifyPlan: document.getElementById('shopifyPlan').value || 'Not specified',
            description: document.getElementById('storeDescription').value || 'Not specified',
            keyProducts: document.getElementById('keyProducts').value || 'Not specified',
            specialReqs: document.getElementById('specialRequirements').value || 'None',
        };

        // Gather selected needs
        const needs = [];
        checkboxes.forEach(cb => { if (cb.checked) needs.push(cb.value); });
        const needsText = needs.length > 0 ? needs.join(', ') : 'Complete Store Strategy';

        // Build the prompt
        const prompt = buildPrompt(data, needsText);

        // Show output
        document.getElementById('promptOutput').textContent = prompt;
        document.getElementById('outputSection').classList.add('active');
        document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

        updateProgress();
    });

    function buildPrompt(d, needs) {
        return `I want you to act as my expert Shopify store consultant and e-commerce strategist. I need your help with: ${needs}.

Here are my store details:

📌 STORE OVERVIEW
━━━━━━━━━━━━━━━━━━━
• Store Name: ${d.name}
• Niche / Category: ${d.niche}
• Store Description: ${d.description}
• Shopify Plan: ${d.shopifyPlan}

🎯 TARGET AUDIENCE
━━━━━━━━━━━━━━━━━━━
• Age Group: ${d.age}
• Gender Focus: ${d.gender}
• Target Region: ${d.country}

📦 PRODUCTS
━━━━━━━━━━━━━━━━━━━
• Number of Products: ${d.productCount}
• Price Range: ${d.priceRange}
• Key Products / Best Sellers: ${d.keyProducts}

🎨 BRAND IDENTITY
━━━━━━━━━━━━━━━━━━━
• Brand Voice: ${d.brandVoice}

📝 SPECIAL REQUIREMENTS
━━━━━━━━━━━━━━━━━━━
${d.specialReqs}

━━━━━━━━━━━━━━━━━━━

Based on the above information, please:

1. Create a comprehensive strategy and implementation plan for my ${d.niche} store.
2. Write compelling, SEO-optimized content tailored to my ${d.brandVoice || 'brand'} voice.
3. Suggest store structure, navigation, and layout recommendations.
4. Provide product description templates I can use across my ${d.productCount} products.
5. Recommend marketing strategies to target my ${d.age}, ${d.gender} audience in ${d.country}.
6. Create any necessary copy including homepage sections, about us, and policy pages.

Please make everything actionable, specific to my ${d.niche} niche, and ready to implement directly on my Shopify store.

If you need any clarification about my store vision, feel free to ask before proceeding.`;
    }

    function copyPrompt() {
        const text = document.getElementById('promptOutput').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '📋 Copy';
                btn.classList.remove('copied');
            }, 2500);
        });
    }

    function resetForm() {
        if (!confirm('Sab data muiye jabe, sure boss?')) return;
        document.getElementById('storeForm').reset();
        document.getElementById('outputSection').classList.remove('active');
        updateProgress();
    }

    // Initial progress
    updateProgress();
</script>

</body>
</html>
